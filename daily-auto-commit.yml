name: Daily Auto Commit

on:
  schedule:
    - cron: '0 9 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  auto-commit:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Update log file
        run: |
          mkdir -p logs
          echo "Commit made on $(date -u '+%Y-%m-%d %H:%M:%S UTC')" >> logs/activity.log

      - name: Commit and push
        run: |
          git config user.name "chaturvediakshay74-prog"
          git config user.email "chaturvediakshay74-prog@users.noreply.github.com"

          git add logs/activity.log

          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi

          git commit -m "chore: daily auto commit $(date -u '+%Y-%m-%d')"

          git pull --rebase origin main
          git push origin main
